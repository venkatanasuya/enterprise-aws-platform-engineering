name: Docker Build and Push

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::<AWS_ACCOUNT_ID>:role/<WORKLOAD_ROLE>
          aws-region: <AWS_REGION>

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Generate tags
        run: |
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Build
        run: |
          docker build             -t <ECR_REGISTRY>/<ECR_REPOSITORY>:${DATE}-${SHORT_SHA}             -t <ECR_REGISTRY>/<ECR_REPOSITORY>:sha-${SHORT_SHA} .

      - name: Push immutable tags
        run: |
          docker push <ECR_REGISTRY>/<ECR_REPOSITORY>:${DATE}-${SHORT_SHA}
          docker push <ECR_REGISTRY>/<ECR_REPOSITORY>:sha-${SHORT_SHA}
